# Temporary HTTP-only config used ONLY to obtain the first TLS certificate
# (nginx needs to be serving :80 for certbot's webroot challenge before any
# certificate exists to serve :443 with). See scripts/init-tls.sh.
server {
    listen 80;
    server_name api.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Celestial API — TLS bootstrap in progress\n";
        add_header Content-Type text/plain;
    }
}
